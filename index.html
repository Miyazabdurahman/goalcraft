<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logo.png  " />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowify Summer Camp</title>
    
    <!-- Montserrat Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta property="og:image" content="logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="logo.png" />
    <!--
      Pairs with public/404.html — decodes a redirected deep link (e.g.
      /programmes/mazha) back into the real URL before React Router mounts,
      so refreshing or sharing a programme page link works on static hosts
      like GitHub Pages.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
